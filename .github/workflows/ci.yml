name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
      - name: Instalar PlatformIO
        run: pip install --upgrade platformio
      - name: Testes da logica pura
        run: pio test -e native
      - name: Compilar firmware
        run: |
          cp src/secrets.h.example src/secrets.h
          # liga o acesso remoto para compilar tambem o cliente WireGuard
          sed -i 's|^// #define WG_|#define WG_|' src/secrets.h
          pio run -e goouuu_esp32s3_cam
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: .pio/build/goouuu_esp32s3_cam/firmware.bin

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Sintaxe JS
        run: for f in web/*.js; do node --check "$f"; done

  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Dependencias
        run: |
          npm install --prefix test/web @vladmandic/human@3.3.6
          pip install playwright pillow
          python -m playwright install --with-deps chromium
          python test/web/make_scenes.py
      - name: Teste ponta a ponta da interface
        run: |
          sudo -E env "PATH=$PATH" python test/web/mock_server.py web test/web/node_modules/@vladmandic/human > mock.log 2>&1 &
          sleep 3
          SHOTS_DIR=$PWD python test/web/ui_test.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: "*.png"
