[platformio]
default_envs = goouuu_esp32s3_cam

[env:goouuu_esp32s3_cam]
; versão fixa = builds reproduzíveis (Arduino-ESP32 2.0.17 / ESP-IDF 4.4)
platform = espressif32 @ 6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; flash 16 MB + PSRAM octal 8 MB (N16R8)
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.filesystem = littlefs
lib_deps =
    bblanchon/ArduinoJson @ ^7.2.1
extra_scripts = pre:tools/embed_web.py
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
build_src_flags =
    -Wall
    -Wno-missing-field-initializers

; Atualização pelo Wi-Fi (após o 1º upload por USB):
;   PowerShell:  $env:CAM_PASSWORD="sua-senha"; pio run -e ota -t upload
[env:ota]
extends = env:goouuu_esp32s3_cam
upload_protocol = espota
upload_port = esp32cam.local
upload_flags = --auth=${sysenv.CAM_PASSWORD}

; Testes da lógica pura no PC:  pio test -e native
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -Wall -Wextra
